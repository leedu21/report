<style>body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#F4F6F4;color:#1f2a24;margin:0;padding:16px}.lock{max-width:420px;margin:48px auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px #0002}
.lock h1{font-size:20px;margin:0 0 4px}.sub{color:#555;margin:0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #bbb;width:100%;box-sizing:border-box;margin-top:8px}button{background:#2D6A4F;color:#fff;border:0;font-weight:700}#err{color:#D2553A;min-height:1.4em}
.rp{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1f2a24;max-width:480px;margin:0 auto;padding:4px 0 32px;line-height:1.6}.rp *{box-sizing:border-box}
.rp-head{padding:20px 4px 8px}.rp-sub{font-size:13px;color:#52695c;letter-spacing:.04em}.rp h1{font-size:24px;margin:2px 0 0;font-weight:700}
.rp-card{background:#fff;border-radius:12px;padding:16px;margin-top:12px;border:1px solid #e3e9e5;box-shadow:0 1px 2px rgba(20,30,50,.05)}
.rp-t{font-size:12px;font-weight:700;letter-spacing:.08em;color:#52695c;margin:0 0 10px}.rp-pre{white-space:pre-wrap;margin:0;line-height:1.85}.rp-mut{margin:0;color:#7b8a80;font-size:14px}
.rp-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rp-tile{background:#F4F6F4;border-radius:10px;padding:12px}.rp-tile span{display:block;font-size:12px;color:#52695c}.rp-tile b{display:block;font-size:22px;color:#2D6A4F;font-weight:700}
.rp-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px}.rp-dw{color:#7b8a80;font-size:11px}
.rp-cal i{font-style:normal;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;border-radius:50%;color:#b3beb7}.rp-cal i.c{border:1.5px solid #c5d1ca;color:#6b7c72}.rp-cal i.p{background:#2D6A4F;color:#fff;font-weight:700}
.rp-leg{display:flex;gap:14px;margin-top:10px;font-size:12px;color:#52695c}.rp-leg span{display:flex;align-items:center;gap:5px}.rp-leg i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid #c5d1ca}.rp-leg i.p{background:#2D6A4F;border-color:#2D6A4F}
.rp-big{font-size:30px;font-weight:700;color:#2D6A4F;margin:0 0 8px}.rp-row{display:grid;grid-template-columns:3.2em 1fr 3.6em;gap:10px;align-items:center;margin-top:8px;font-size:14px}.rp-row em{font-style:normal;color:#52695c;text-align:right;font-size:13px}
.rp-bar{height:10px;background:#e8eee9;border-radius:6px;overflow:hidden}.rp-bar u{display:block;height:100%;background:#52B788;border-radius:6px}
.rp-vo{display:flex;align-items:center;gap:18px}.rp-vl div{margin:4px 0;font-size:14px}.rp-vl b{color:#2D6A4F}
.rp-chips{display:flex;flex-wrap:wrap;gap:8px}.rp-chip{background:#eaf3ee;color:#2D6A4F;border-radius:999px;padding:5px 12px;font-size:14px}</style></head><body>

var RR=function RR(d){
  var e=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var sec=function(t,b){return '<div class="rp-card"><div class="rp-t">'+t+'</div>'+b+'</div>'};
  var st=d.stats,at=st.att,hw=st.hw,un=st.units,vo=st.vocab,i,h='<div class="rp"><div class="rp-head"><div class="rp-sub">'+e(d.label)+' 월말 리포트</div><h1>'+e(d.name)+' 학생</h1></div>';
  if(d.summary)h+=sec('이번 달 코멘트','<p class="rp-pre">'+e(d.summary)+'</p>');
  var tiles=[['출석',at.present+' / '+at.total+'일'],['과제 완료',hw.total?hw.pct+'%':'-']];
  if(vo.on)tiles.push(['영어 단어 통과',vo.pass+'회']);
  if(un.total)tiles.push(['통과한 단원',un.total+'개']);
  h+=sec('이번 달 학습 요약','<div class="rp-tiles">'+tiles.map(function(t){return '<div class="rp-tile"><span>'+t[0]+'</span><b>'+t[1]+'</b></div>'}).join('')+'</div>');
  var cal=['일','월','화','수','목','금','토'].map(function(x){return '<div class="rp-dw">'+x+'</div>'}).join('');
  for(i=0;i<at.first;i++)cal+='<div></div>';
  for(i=0;i<at.cal.length;i++)cal+='<i class="'+(at.cal[i]===2?'p':at.cal[i]===1?'c':'')+'">'+(i+1)+'</i>';
  h+=sec('출석','<div class="rp-cal">'+cal+'</div><div class="rp-leg"><span><i class="p"></i>출석</span><span><i></i>수업일(미출석)</span></div>');
  if(hw.total)h+=sec('과제 완료','<div class="rp-big">'+hw.pct+'%</div>'+hw.by.map(function(b){var p=b.total?Math.round(b.done/b.total*100):0;return '<div class="rp-row"><span>'+e(b.s)+'</span><div class="rp-bar"><u style="width:'+p+'%"></u></div><em>'+b.done+'/'+b.total+'</em></div>'}).join(''));
  if(vo.on){
    if(vo.tries){var C=2*Math.PI*40,pl=C*vo.pass/vo.tries;
      h+=sec('영어 단어 시험','<div class="rp-vo"><svg viewBox="0 0 100 100" width="110" height="110"><circle cx="50" cy="50" r="40" fill="none" stroke="#f1d9d0" stroke-width="14"/><circle cx="50" cy="50" r="40" fill="none" stroke="#2D6A4F" stroke-width="14" stroke-dasharray="'+pl.toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a24">'+Math.round(vo.pass/vo.tries*100)+'%</text></svg><div class="rp-vl"><div>통과 <b>'+vo.pass+'회</b></div><div>불통과 <b>'+vo.fail+'회</b></div><div>가장 높게 통과한 단계 <b>'+(vo.maxDay?'Day '+vo.maxDay:'-')+'</b></div></div></div>');

  }
  if(un.total)h+=sec('통과한 단원','<div class="rp-chips">'+un.by.map(function(b){return '<span class="rp-chip">'+e(b.s)+' <b>'+b.n+'개</b></span>'}).join('')+'</div>');
  if(d.notice)h+=sec('안내','<p class="rp-pre">'+e(d.notice)+'</p>');
  if(d.feeTxt)h+=sec('원비 안내','<p class="rp-pre">'+e(d.feeTxt)+'</p>');
  return h+'</div>';
};
function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function g(i){return document.getElementById(i)}
function dec(pw,p){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(k0){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(p.s),iterations:200000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt'])}).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b(p.i)},k,b(p.c))}).then(function(pt){return JSON.parse(new TextDecoder().decode(pt))})}

var M=false;
g('adm').onclick=function(e){e.preventDefault();M=!M;g('n').hidden=M;g('b').hidden=M;g('mkw').hidden=!M;g('err').textContent=''};
g('go').onclick=function(){if(P.k&&!K){g('err').textContent='받으신 링크 전체(주소 뒤 #k=… 포함)를 그대로 열어 주세요.';return}
var q=M?dec('master|'+g('mk').value+SX,P.m||{s:'AA==',i:'AA==',c:'AA=='}):dec(g('n').value.replace(/\s/g,'')+'|'+g('b').value.replace(/\D/g,'')+SX,P);
q.then(show).catch(function(){g('err').textContent=M?'마스터 키가 맞지 않아요.':'이름 또는 생년월일이 맞지 않아요.'})};
function show(d){g('lock').hidden=true;var o=g('out');o.hidden=false;o.innerHTML=RR(d)}
